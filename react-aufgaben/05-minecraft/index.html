<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft-Hotbar</title>
    <link rel="stylesheet" href="style.css">

    <!-- React und Babel aus dem Internet laden (nicht verändern) -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">

        const { useState, useEffect } = React;

        const DATEN_URL = "https://cdn.jsdelivr.net/gh/PrismarineJS/minecraft-data@master/data/pc/1.20/blocks.json";
        const TEXTUR_URL = "https://cdn.jsdelivr.net/gh/PrismarineJS/minecraft-assets@master/data/1.20.2/blocks_textures.json";
        const BILD_URL = "https://cdn.jsdelivr.net/gh/PrismarineJS/minecraft-assets@master/data/1.20.2/";
        const HOTBAR_GROESSE = 9;

        const FILTER = [
            { name: "Alle", wert: "Alle" },
            { name: "⛏️ Spitzhacke", wert: "pickaxe" },
            { name: "🪓 Axt", wert: "axe" },
            { name: "🥄 Schaufel", wert: "shovel" },
            { name: "✋ Hand", wert: "hand" }
        ];

        const WERKZEUG_DEUTSCH = {
            pickaxe: "Spitzhacke",
            axe: "Axt",
            shovel: "Schaufel",
            hoe: "Hacke",
            hand: "Hand"
        };

        // Aus "mineable/pickaxe" wird "pickaxe", alles andere ist "hand"
        function werkzeugVon(block) {
            const teile = block.material.split("/");
            const werkzeug = teile[teile.length - 1];
            return WERKZEUG_DEUTSCH[werkzeug] ? werkzeug : "hand";
        }

        // Härte als Stufe: weich, mittel, hart oder unzerstörbar
        function haerteStufe(block) {
            if (block.hardness < 0 || block.hardness >= 50) return "unzerstoerbar";
            if (block.hardness < 1) return "weich";
            if (block.hardness < 3) return "mittel";
            return "hart";
        }

        const STUFE_DEUTSCH = {
            weich: "Weich",
            mittel: "Mittel",
            hart: "Hart",
            unzerstoerbar: "Unzerstörbar"
        };


        // =====================================================
        // Ein Block in der großen Liste
        // =====================================================
        function BlockKarte({ block, inHotbar, onKlick }) {
            const bild = block.bild;
            const werkzeug = WERKZEUG_DEUTSCH[block.werkzeug];
            const stufe = STUFE_DEUTSCH[block.stufe];
            const leuchtet = block.emitLight > 0;

            let klassen = "karte " + block.stufe;
            if (inHotbar) klassen = klassen + " in-hotbar";

            return (
                <div className={klassen} onClick={onKlick}>

                    {/* ✏️ DEIN HTML 2: Stapelgröße (span className="stapel"), Bild (img),
                                       Name (h3), Werkzeug (p) und Härte (p className="haerte") */}


                    {leuchtet &&
                         <span className="licht">💡</span>}
                         <img src={bild} alt={block.displayName} />
                         <h3>{block.displayName}</h3>
                         <p>{werkzeug}</p>
                         <p className="haerte">{stufe}</p>
                </div>
            );
        }


        // =====================================================
        // Ein Block unten in der Hotbar
        // =====================================================
        function HotbarPlatz({ block, onKlick }) {
            const bild = block.bild;

            return (
                <div className="hotbar-platz" onClick={onKlick}>

                    {/* ✏️ DEIN HTML 3: nur das Bild (img) */}
<img src={bild} alt={block.displayName} />

                </div>
            );
        }


        // =====================================================
        // Die App (JavaScript ist fertig)
        // =====================================================
        function App() {
            const [bloecke, setBloecke] = useState([]);
            const [filter, setFilter] = useState("Alle");
            const [hotbar, setHotbar] = useState([]);

            useEffect(() => {
                Promise.all([
                    fetch(DATEN_URL).then((antwort) => antwort.json()),
                    fetch(TEXTUR_URL).then((antwort) => antwort.json())
                ]).then(([daten, texturen]) => {
                    const texturVon = {};
                    texturen.forEach((t) => { texturVon[t.name] = t.texture; });

                    const ganzeBloecke = daten
                        .filter((b) => b.boundingBox === "block" && !b.transparent && texturVon[b.name])
                        .map((b) => ({
                            ...b,
                            bild: BILD_URL + texturVon[b.name].replace("minecraft:", "") + ".png",
                            werkzeug: werkzeugVon(b),
                            stufe: haerteStufe(b)
                        }));
                    setBloecke(ganzeBloecke);
                });
            }, []);

            function blockUmschalten(block) {
                if (hotbar.some((b) => b.name === block.name)) {
                    setHotbar(hotbar.filter((b) => b.name !== block.name));
                } else if (hotbar.length < HOTBAR_GROESSE) {
                    setHotbar([...hotbar, block]);
                }
            }

            const angezeigteBloecke = filter === "Alle"
                ? bloecke
                : bloecke.filter((b) => b.werkzeug === filter);

            const anzahlInHotbar = hotbar.length;
            const anzahlLeuchtend = hotbar.filter((b) => b.emitLight > 0).length;
            const leerePlaetze = HOTBAR_GROESSE - anzahlInHotbar;

            return (
                <div className="seite">

                    <header>
                        {/* ✏️ DEIN HTML 1: Überschrift (h1) und Untertitel (p className="untertitel") */}
<h1>Welche Tools für Welche Blöcke</h1>

                    </header>

                    <section className="hotbar-box">
                        <div className="hotbar">
                            {hotbar.map((block) => (
                                <HotbarPlatz key={block.name} block={block} onKlick={() => blockUmschalten(block)} />
                            ))}
                            {Array.from({ length: leerePlaetze }).map((_, i) => (
                                <div key={"leer" + i} className="leer-platz"></div>
                            ))}
                        </div>

                        <div className="hotbar-info">
                            {/* ✏️ DEIN HTML 4: {anzahlInHotbar} / 9 Blöcke  und  💡 {anzahlLeuchtend} leuchten */}
 <p>{anzahlInHotbar} / 9 Blöcke</p>
                            <p>💡 {anzahlLeuchtend} leuchten</p>
                        </div>
                    </section>

                    {anzahlInHotbar === HOTBAR_GROESSE && (
                        <div className="hotbar-voll">
                            {/* ✏️ DEIN HTML 5: "🎉 Deine Hotbar ist voll! Los geht's!" */}
🎉 Deine Hotbar ist voll! Los geht's!
                        </div>
                    )}

                    <nav className="filter-leiste">
                        {FILTER.map((f) => (
                            <button
                                key={f.wert}
                                className={f.wert === filter ? "filter-button aktiv" : "filter-button"}
                                onClick={() => setFilter(f.wert)}
                            >
                                {f.name}
                            </button>
                        ))}
                    </nav>

                    {bloecke.length === 0 && <p className="laden">Blöcke werden abgebaut ... ⛏️</p>}

                    <div className="karten">
                        {angezeigteBloecke.map((block) => (
                            <BlockKarte
                                key={block.name}
                                block={block}
                                inHotbar={hotbar.some((b) => b.name === block.name)}
                                onKlick={() => blockUmschalten(block)}
                            />
                        ))}
                    </div>

                    <footer>
                        {/* ✏️ DEIN HTML 6: "Daten und Bilder: PrismarineJS" und "Gebaut von DEIN NAME" */}
Daten und Bilder: PrismarineJS
Gebaut von Leon

                    </footer>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    </script>
</body>
</html>
