<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball-App</title>
    <link rel="stylesheet" href="style.css">

    <!-- React und Babel aus dem Internet laden (nicht verändern) -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">

        const { useState, useEffect } = React;

        const API_URL = "https://www.thesportsdb.com/api/v1/json/123/search_all_teams.php?l=NBA";
        const SPURS_URL = "https://www.thesportsdb.com/api/v1/json/123/searchteams.php?t=San_Antonio_Spurs";

        const SORTIERUNGEN = [
            { name: "A–Z", wert: "name" },
            { name: "Älteste zuerst", wert: "alt" },
            { name: "Neueste zuerst", wert: "neu" }
        ];


        // =====================================================
        // Eine Karte für EIN Team
        // =====================================================
        function TeamKarte({ team, istFavorit, onFavorit, onKlick }) {
            return (
                <div className={istFavorit ? "karte favorit" : "karte"} onClick={onKlick}>

                    {/* ✏️ DEIN HTML 3: Logo (img), Name (h2), Abkürzung (span className="kurz"),
                                       Gründungsjahr (p) und Halle (p) */}


                    <button
                        className="herz"
                        onClick={(e) => {
                            e.stopPropagation();   // Herz-Klick öffnet NICHT die Details
                            onFavorit();
                        }}
                    >
                        {istFavorit ? "❤️" : "🤍"}
                    </button>
                </div>
            );
        }


        // =====================================================
        // ⭐ ERWEITERUNG: Die Detail-Box, wenn man ein Team anklickt
        // =====================================================
        function Details({ team, onSchliessen }) {

            // Fertig: Text, Webseite, Links
            const text = team.strDescriptionDE || team.strDescriptionEN || "";
            const beschreibung = text.slice(0, 350) + " ...";
            const webseite = "https://" + team.strWebsite;
            const wikipedia = "https://de.wikipedia.org/wiki/Spezial:Suche?search=" + encodeURIComponent(team.strTeam);
            const farben = [team.strColour1, team.strColour2, team.strColour3].filter(Boolean);
            const links = [
                { name: "📸 Instagram", adresse: team.strInstagram },
                { name: "👍 Facebook", adresse: team.strFacebook },
                { name: "🐦 X / Twitter", adresse: team.strTwitter },
                { name: "▶️ YouTube", adresse: team.strYoutube }
            ]
                .filter((link) => link.adresse)
                .map((link) => ({ ...link, adresse: "https://" + link.adresse }));

            // Fertig: das letzte Spiel vom Team laden
            const [spiel, setSpiel] = useState(null);
            useEffect(() => {
                setSpiel(null);
                fetch("https://www.thesportsdb.com/api/v1/json/123/eventslast.php?id=" + team.idTeam)
                    .then((antwort) => antwort.json())
                    .then((daten) => setSpiel(daten.results ? daten.results[0] : null));
            }, [team.idTeam]);

            return (
                <div className="overlay" onClick={onSchliessen}>
                    <div className="details" onClick={(e) => e.stopPropagation()}>
                        <button className="schliessen" onClick={onSchliessen}>✕</button>

                        {team.strBanner && (
                            <>
                                {/* ✏️ DEIN HTML 5: Banner-Bild (img className="banner") mit src={team.strBanner} */}

                            </>
                        )}

                        {/* ✏️ DEIN HTML 6: Name (h2), Ort, Halle, Gegründet (je ein p mit strong)
                                           und die Beschreibung (p className="beschreibung") */}


                        {/* ✏️ DEIN HTML 7: ein p "Team-Farben:" (die Farb-Punkte sind schon da) */}

                        <div className="farben">
                            {farben.map((farbe) => (
                                <span key={farbe} className="farbe" style={{ backgroundColor: farbe }}></span>
                            ))}
                        </div>

                        {spiel && (
                            <div className="spiel">
                                {/* ✏️ DEIN HTML 8a: Überschrift (h3) "🏀 Letztes Spiel" und ein p mit dem Datum */}


                                <div className="spielstand">
                                    {/* ✏️ DEIN HTML 8b: Heim-Logo (img), Heim-Team (p),
                                                        Ergebnis (span className="punkte"), Gast-Team (p), Gast-Logo (img) */}


                                </div>
                            </div>
                        )}

                        <div className="link-leiste">
                            {/* ✏️ DEIN HTML 9: Link zur Webseite (a className="link-button") mit {webseite} */}


                            {links.map((link) => (
                                <a key={link.name} className="link-button" href={link.adresse} target="_blank">
                                    {/* ✏️ DEIN HTML 9: der Name vom Link */}
                                </a>
                            ))}

                            {/* ✏️ DEIN HTML 9: Link zu Wikipedia (a className="link-button") mit {wikipedia} */}

                        </div>
                    </div>
                </div>
            );
        }


        // =====================================================
        // Die App (JavaScript ist fertig)
        // =====================================================
        function App() {
            const [teams, setTeams] = useState([]);
            const [suche, setSuche] = useState("");
            const [sortierung, setSortierung] = useState("name");
            const [favoriten, setFavoriten] = useState([]);

            const [ausgewaehlt, setAusgewaehlt] = useState(null);   // ⭐ angeklicktes Team

            useEffect(() => {
                // Der kostenlose Zugang liefert nur 10 Teams. Die Spurs laden wir extra dazu!
                Promise.all([
                    fetch(API_URL).then((antwort) => antwort.json()),
                    fetch(SPURS_URL).then((antwort) => antwort.json())
                ]).then(([daten, spurs]) => {
                    const alle = [...(daten.teams || []), ...(spurs.teams || [])];
                    const ohneDoppelte = alle.filter((team, i) => alle.findIndex((t) => t.idTeam === team.idTeam) === i);
                    setTeams(ohneDoppelte.filter((team) => team.strSport === "Basketball"));
                });
            }, []);

            function favoritUmschalten(id) {
                if (favoriten.includes(id)) {
                    setFavoriten(favoriten.filter((f) => f !== id));
                } else {
                    setFavoriten([...favoriten, id]);
                }
            }

            const gefilterteTeams = teams
                .filter((team) => team.strTeam.toLowerCase().includes(suche.toLowerCase()))
                .sort((a, b) => {
                    if (sortierung === "alt") return a.intFormedYear - b.intFormedYear;
                    if (sortierung === "neu") return b.intFormedYear - a.intFormedYear;
                    return a.strTeam.localeCompare(b.strTeam);
                });

            const anzahlTeams = gefilterteTeams.length;
            const anzahlFavoriten = favoriten.length;

            return (
                <div className="seite">

                    <header>
                        {/* ✏️ DEIN HTML 1: Überschrift (h1) und Untertitel (p className="untertitel") */}


                    </header>

                    <input
                        className="suche"
                        placeholder="Team suchen ..."
                        value={suche}
                        onChange={(e) => setSuche(e.target.value)}
                    />

                    <div className="sortier-leiste">
                        {SORTIERUNGEN.map((s) => (
                            <button
                                key={s.wert}
                                className={s.wert === sortierung ? "sortier-button aktiv" : "sortier-button"}
                                onClick={() => setSortierung(s.wert)}
                            >
                                {s.name}
                            </button>
                        ))}
                    </div>

                    {/* ✏️ DEIN HTML 2: Zähler (p className="zaehler") */}


                    <div className="karten">
                        {gefilterteTeams.map((team) => (
                            <TeamKarte
                                key={team.idTeam}
                                team={team}
                                istFavorit={favoriten.includes(team.idTeam)}
                                onFavorit={() => favoritUmschalten(team.idTeam)}
                                onKlick={() => setAusgewaehlt(team)}
                            />
                        ))}
                    </div>

                    {ausgewaehlt && (
                        <Details team={ausgewaehlt} onSchliessen={() => setAusgewaehlt(null)} />
                    )}

                    {teams.length > 0 && anzahlTeams === 0 && (
                        <div className="nichts-gefunden">

                            {/* ✏️ DEIN HTML 4: ein großes Emoji (z. B. in einem p className="emoji")
                                               und der Text "Kein Team gefunden" */}


                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    </script>
</body>
</html>
