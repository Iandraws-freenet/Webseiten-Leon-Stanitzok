<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball-App</title>
    <link rel="stylesheet" href="style.css">

    <!-- React und Babel aus dem Internet laden (nicht verändern) -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">

        const { useState, useEffect } = React;

        const API_URL = "https://www.thesportsdb.com/api/v1/json/123/search_all_teams.php?l=NBA";

        const SORTIERUNGEN = [
            { name: "A–Z", wert: "name" },
            { name: "Älteste zuerst", wert: "alt" },
            { name: "Neueste zuerst", wert: "neu" }
        ];


        // =====================================================
        // Eine Karte für EIN Team
        // =====================================================
        function TeamKarte({ team, istFavorit, onFavorit }) {
            return (
                <div className={istFavorit ? "karte favorit" : "karte"}>

                    {/* ✏️ DEIN HTML 3: Logo (img), Name (h2), Abkürzung (span className="kurz"),
                                       Gründungsjahr (p) und Halle (p) */}


                    <button className="herz" onClick={onFavorit}>
                        {istFavorit ? "❤️" : "🤍"}
                    </button>
                </div>
            );
        }


        // =====================================================
        // Die App (JavaScript ist fertig)
        // =====================================================
        function App() {
            const [teams, setTeams] = useState([]);
            const [suche, setSuche] = useState("");
            const [sortierung, setSortierung] = useState("name");
            const [favoriten, setFavoriten] = useState([]);

            useEffect(() => {
                fetch(API_URL)
                    .then((antwort) => antwort.json())
                    .then((daten) => setTeams(daten.teams || []));
            }, []);

            function favoritUmschalten(id) {
                if (favoriten.includes(id)) {
                    setFavoriten(favoriten.filter((f) => f !== id));
                } else {
                    setFavoriten([...favoriten, id]);
                }
            }

            const gefilterteTeams = teams
                .filter((team) => team.strTeam.toLowerCase().includes(suche.toLowerCase()))
                .sort((a, b) => {
                    if (sortierung === "alt") return a.intFormedYear - b.intFormedYear;
                    if (sortierung === "neu") return b.intFormedYear - a.intFormedYear;
                    return a.strTeam.localeCompare(b.strTeam);
                });

            const anzahlTeams = gefilterteTeams.length;
            const anzahlFavoriten = favoriten.length;

            return (
                <div className="seite">

                    <header>
                        {/* ✏️ DEIN HTML 1: Überschrift (h1) und Untertitel (p className="untertitel") */}


                    </header>

                    <input
                        className="suche"
                        placeholder="Team suchen ..."
                        value={suche}
                        onChange={(e) => setSuche(e.target.value)}
                    />

                    <div className="sortier-leiste">
                        {SORTIERUNGEN.map((s) => (
                            <button
                                key={s.wert}
                                className={s.wert === sortierung ? "sortier-button aktiv" : "sortier-button"}
                                onClick={() => setSortierung(s.wert)}
                            >
                                {s.name}
                            </button>
                        ))}
                    </div>

                    {/* ✏️ DEIN HTML 2: Zähler (p className="zaehler") */}


                    <div className="karten">
                        {gefilterteTeams.map((team) => (
                            <TeamKarte
                                key={team.idTeam}
                                team={team}
                                istFavorit={favoriten.includes(team.idTeam)}
                                onFavorit={() => favoritUmschalten(team.idTeam)}
                            />
                        ))}
                    </div>

                    {teams.length > 0 && anzahlTeams === 0 && (
                        <div className="nichts-gefunden">

                            {/* ✏️ DEIN HTML 4: ein großes Emoji (z. B. in einem p className="emoji")
                                               und der Text "Kein Team gefunden" */}


                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    </script>
</body>
</html>
