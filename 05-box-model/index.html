<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Das Box-Model</h1>

        <div class="box box-rot">
            <h2>Padding</h2>
            <p>Padding ist der Innenabstand zwischen Inhalt und Rahmen.</p>
        </div>

        <div class="box box-gruen">
            <h2>Border</h2>
            <p>Border ist der Rahmen um ein Element.</p>
        </div>

        <div class="box box-blau">
            <h2>Margin</h2>
            <p>Margin ist der Außenabstand zu anderen Elementen.</p>
        </div>
    </div>

</body>
</html>
